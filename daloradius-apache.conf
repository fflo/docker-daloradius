# Port 80 is already configured by the base image, the users portal needs 8000
Listen 8000

# Operators (management) interface
<VirtualHost *:80>
    ServerAdmin operators@localhost
    DocumentRoot /var/www/daloradius/app/operators

    <Directory /var/www/daloradius/app/operators>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # server-side only: notification templates and helpers, never fetched directly
    <Directory /var/www/daloradius/app/operators/notifications>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/daloradius>
        Require all denied
    </Directory>
</VirtualHost>

# Users (self-service) portal
<VirtualHost *:8000>
    ServerAdmin users@localhost
    DocumentRoot /var/www/daloradius/app/users

    <Directory /var/www/daloradius/app/users>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # server-side only: notification templates and helpers, never fetched directly
    <Directory /var/www/daloradius/app/users/notifications>
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/daloradius>
        Require all denied
    </Directory>
</VirtualHost>
