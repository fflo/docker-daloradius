; PHP settings for the daloRADIUS image, loaded after the production php.ini.

; Session upload progress is not used by daloRADIUS. Keeping it off removes the
; attack surface of CVE-2026-109619 and of CVE-2026-115560, whose fix has not
; been released yet (PHP advisory of 23 October 2026).
session.upload_progress.enabled = 0

; Do not advertise the PHP version in response headers.
expose_php = Off
